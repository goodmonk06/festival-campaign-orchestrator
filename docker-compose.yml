version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: festival-campaigns-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: festivaluser
      POSTGRES_PASSWORD: festivalpass
      POSTGRES_DB: festival_campaigns
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U festivaluser -d festival_campaigns']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
